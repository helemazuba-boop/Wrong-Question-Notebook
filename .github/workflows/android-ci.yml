name: Android CI
on:
  pull_request:
  push:
    branches: [main, release/note-baseline-prod, "ci/**"]
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Android build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - name: Build debug and release, lint and execute unit tests
        working-directory: android
        run: ./gradlew assembleDebug assembleRelease lintDebug testDebugUnitTest --no-daemon
      - name: Require actual executed unit tests
        run: python3 .github/scripts/verify-junit.py android/app/build/test-results/testDebugUnitTest 4
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-build
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/reports/
            android/app/build/test-results/
          retention-days: 14
  instrumentation:
    name: Android native tests (API ${{ matrix.api }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api: [30, 36]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: cd android && ./gradlew connectedDebugAndroidTest -PwqnCiAssets=true --no-daemon
      - name: Require actual executed native tests
        run: python3 .github/scripts/verify-junit.py android/app/build/outputs/androidTest-results/connected 6
      - name: Save emulator logs
        if: failure()
        run: adb logcat -d > android-logcat.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-native-api-${{ matrix.api }}
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
            android-logcat.txt
          retention-days: 7
