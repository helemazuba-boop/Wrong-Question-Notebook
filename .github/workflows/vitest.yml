name: Vitest

on:
  pull_request:
    paths:
      - 'web/**'
  push:
    branches:
      - main
    paths:
      - 'web/**'

permissions:
  contents: read

jobs:
  test:
    name: Run vitest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test
