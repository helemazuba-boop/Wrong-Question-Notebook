name: Web CI

on:
  pull_request:
  push:
    branches:
      - main
      - release/note-baseline-prod
      - "ci/**"
  schedule:
    - cron: "20 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: web

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: Type-check, lint, format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

  test:
    name: Run vitest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

  build:
    name: Production build
    runs-on: ubuntu-latest
    env:
      # Placeholders only. next.config.ts refuses to build without a public
      # Supabase URL and key and, under NODE_ENV=production, an expected host.
      # This mirrors the build arguments the Dockerfile passes; server
      # credentials are runtime-only and are never needed to build.
      NEXT_PUBLIC_SUPABASE_URL: https://ci.invalid
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_OR_ANON_KEY: sb_publishable_ci_placeholder
      WQN_SUPABASE_EXPECTED_HOST: ci.invalid
      SITE_URL: https://ci.invalid
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check client bundle for server secrets
        run: npm run check:client-bundle-secrets

  dependency-audit:
    name: Dependency audit (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [web, realtime-proxy]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Verify audit policy
        working-directory: .
        run: node --test .github/scripts/audit-policy.test.mjs

      - name: Audit locked production and development dependencies
        working-directory: .
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          directory=web
          if [ "$PACKAGE" = realtime-proxy ]; then directory=web/server/realtime-proxy; fi
          node .github/scripts/audit-policy.mjs "$directory" "artifacts/audit/$PACKAGE"

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-audit-${{ matrix.package }}
          path: artifacts/audit/${{ matrix.package }}
          retention-days: 14
