name: Deploy Scripts

on:
  pull_request:
    paths:
      - 'deploy/**'
  push:
    branches:
      - main
    paths:
      - 'deploy/**'

permissions:
  contents: read

jobs:
  deploy-scripts:
    name: Deploy script tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run deploy script test suite
        run: bash deploy/tests/run.sh
