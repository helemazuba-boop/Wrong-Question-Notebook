version: 2

updates:
  - package-ecosystem: "gradle"
    directory: "/android"
    target-branch: "release/note-baseline-prod"
    schedule:
      interval: "weekly"
    groups:
      android-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/web"
    target-branch: "release/note-baseline-prod"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 10
    ignore:
      # @typescript-eslint 8.72.0 requires TypeScript >=4.8.4 <6.1.0.
      # Revisit when the lint toolchain supports TypeScript 7.
      - dependency-name: "typescript"
        versions: [">=7"]
      # @tiptap/extension-mathematics 3.32.0 supports KaTeX through 0.18.x.
      # Revisit this bound when its declared peer range includes newer KaTeX.
      - dependency-name: "katex"
        versions: [">=0.19"]
      # Runtime provenance and persisted diagnostics explicitly require 5.4.1.
      # Newer versions need a coordinated scheduling/provenance migration.
      - dependency-name: "ts-fsrs"
        versions: [">5.4.1"]
      # eslint-config-next 16.3.3 depends on eslint-plugin-react ^7.37.0, whose
      # peer range stops at ^9.7 -- no 7.x release supports eslint 10. Under
      # eslint 10 it installs (npm overrides the peer with a warning) but then
      # crashes at lint time:
      #   TypeError: Error while loading rule 'react/display-name':
      #   contextOrFilename.getFilename is not a function
      # Revisit once eslint-config-next ships a react plugin with eslint 10
      # support.
      - dependency-name: "eslint"
        update-types:
          - "version-update:semver-major"
    groups:
      # Vitest and its coverage provider declare exact-version peers, so major
      # updates must also arrive together rather than as independent PRs.
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      production-minor-and-patch:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      development-minor-and-patch:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/web/server/realtime-proxy"
    target-branch: "release/note-baseline-prod"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:15"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 10
    groups:
      production-minor-and-patch:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      development-minor-and-patch:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "release/note-baseline-prod"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:30"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    ignore:
      # v6 supports open-source caching with cache-provider: basic.
      # Review the cache behavior and benchmark that upgrade separately.
      - dependency-name: "gradle/actions"
        versions: [">=6"]
