version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 10
    ignore:
      # eslint-config-next 16.3.3 depends on eslint-plugin-react ^7.37.0, whose
      # peer range stops at ^9.7 -- no 7.x release supports eslint 10. Under
      # eslint 10 it installs (npm overrides the peer with a warning) but then
      # crashes at lint time:
      #   TypeError: Error while loading rule 'react/display-name':
      #   contextOrFilename.getFilename is not a function
      # Revisit once eslint-config-next ships a react plugin with eslint 10
      # support.
      - dependency-name: "eslint"
        update-types:
          - "version-update:semver-major"
    groups:
      production-minor-and-patch:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      development-minor-and-patch:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/web/server/realtime-proxy"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:15"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 10
    groups:
      production-minor-and-patch:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      development-minor-and-patch:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:30"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
