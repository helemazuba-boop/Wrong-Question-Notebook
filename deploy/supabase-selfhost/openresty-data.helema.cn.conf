upstream wqn_supabase_kong {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name data.helema.cn;
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name data.helema.cn;

    ssl_certificate /etc/letsencrypt/live/data.helema.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/data.helema.cn/privkey.pem;
    client_max_body_size 20m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;

    location /realtime/v1/ {
        proxy_pass http://wqn_supabase_kong;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }

    location ~ ^/(auth|rest|storage|graphql|functions)/v1(?:/|$) {
        proxy_pass http://wqn_supabase_kong;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_request_buffering off;
    }

    # Do not expose Studio or Kong's root route on the public data domain.
    location / {
        return 404;
    }
}
